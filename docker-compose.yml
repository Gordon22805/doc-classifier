services:
  app:
    build: .
    container_name: ocr-classifier
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      VISION_MODEL: ${VISION_MODEL:-qwen/qwen2.5-vl-72b-instruct:free}
      VISION_BASE_URL: ${VISION_BASE_URL:-https://openrouter.ai/api/v1}
      HOST: 0.0.0.0
      PORT: 8000
      TEMP_DIR: /app/temp
      UPLOAD_DIR: /app/uploads
      RESULTS_DIR: /app/results
    volumes:
      - ./temp:/app/temp
      - ./uploads:/app/uploads
      - ./results:/app/results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
